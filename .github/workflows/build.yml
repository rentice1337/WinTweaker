name: Build

# Сборка при каждом пуше и pull request — проверка, что проект компилируется (exe лежит в артефактах запуска).
#
# Релиз — WinTweaker.exe и контрольная сумма прикрепляются сами:
#   • на сайте: Releases → Draft a new release → новый тег (v2.0.0 или 2.0.0) → Publish;
#   • из консоли: git tag v2.0.0 && git push origin v2.0.0;
#   • к уже созданному релизу без exe: Actions → Build → Run workflow → указать тег.
# Описание релиза дополняется разделом этой версии из CHANGELOG.md и инструкцией по запуску.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, к которому приложить WinTweaker.exe (например v2.0.0). Пусто — просто сборка.'
        required: false
        default: ''
      bench:
        description: 'Замерить плавность интерфейса (кадры при переходах, прокрутке, подсветке)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # релиз с тегом v* уже собирается по пушу тега — второй раз не нужно
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.inputs.tag || (github.event_name == 'release' && github.event.release.tag_name) || (github.ref_type == 'tag' && github.ref_name) || '' }}
      # ключ цифровой подписи (создаётся один раз скриптом tools/New-SigningCert.ps1); нет секретов — exe без подписи
      SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: pwsh
        run: |
          $v = '0.0.0'
          if ($env:TAG) {
            $v = $env:TAG.TrimStart('v', 'V')
            if ($v -notmatch '^\d+\.\d+(\.\d+)?$') { throw "Тег '$env:TAG' — не версия. Нужно вида v2.0.0 или 2.0.0" }
          }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Publish
        run: dotnet publish WinTweaker.csproj -c Release -p:Version=${{ env.VERSION }} -o publish

      - name: UI benchmark
        if: github.event.inputs.bench == 'true'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bench.txt'
          $p = Start-Process publish\WinTweaker.exe -ArgumentList "--bench=$out" -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Write-Host '::warning title=bench::не уложился в 7 минут' }
          if (Test-Path $out) {
            $t = Get-Content $out -Raw
            Write-Host $t
            Write-Host "::warning title=bench::$($t -replace "`r?`n", '%0A')"
          } else { Write-Host '::warning title=bench::файл замера не создан' }

      - name: Verify admin manifest
        shell: pwsh
        run: |
          # в exe должен быть манифест requireAdministrator — иначе программа запустится без прав
          $bytes = [IO.File]::ReadAllBytes("publish/WinTweaker.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes) + [Text.Encoding]::Unicode.GetString($bytes)
          if ($text -notmatch 'requireAdministrator') { throw 'В WinTweaker.exe нет манифеста requireAdministrator' }
          'Манифест requireAdministrator на месте'

      - name: Sign
        if: env.SIGN_PFX != '' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX.Trim()))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe не найден' }
            # метка времени: подпись остаётся действительной и после окончания срока сертификата
            $ok = $false
            foreach ($ts in 'http://timestamp.digicert.com', 'http://timestamp.sectigo.com', 'http://timestamp.globalsign.com/tsa/r6advanced1') {
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGN_PASSWORD /tr $ts /td SHA256 `
                /d 'WinTweak' /du 'https://github.com/${{ github.repository }}' publish\WinTweaker.exe
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Warning "Сервер меток времени $ts не ответил, пробую следующий"
            }
            if (-not $ok) { throw 'Не удалось подписать WinTweaker.exe' }

            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGN_PASSWORD)
            [IO.File]::WriteAllBytes('publish\WinTweaker-signing.cer', $cert.Export('Cert'))
            "SIGN_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            "SIGN_SUBJECT=$($cert.GetNameInfo('SimpleName', $false))" >> $env:GITHUB_ENV

            $sig = Get-AuthenticodeSignature publish\WinTweaker.exe
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'Подпись в exe не найдена' }
            "Подписано: $($sig.SignerCertificate.Subject), отпечаток $($cert.Thumbprint), метка времени: $([bool]$sig.TimeStamperCertificate)"
          }
          finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/WinTweaker.exe -Algorithm SHA256).Hash
          "$hash  WinTweaker.exe" | Out-File publish/WinTweaker.exe.sha256 -Encoding ascii
          "SHA256=$hash" >> $env:GITHUB_ENV
          $mb = [math]::Round((Get-Item publish/WinTweaker.exe).Length / 1MB, 1)
          "SIZE_MB=$mb" >> $env:GITHUB_ENV
          "WinTweaker.exe: $mb МБ, SHA-256 $hash"

      - uses: actions/upload-artifact@v7
        with:
          name: WinTweaker-${{ env.VERSION }}
          path: |
            publish/WinTweaker.exe
            publish/WinTweaker.exe.sha256
            publish/WinTweaker-signing.cer
          if-no-files-found: warn

      - name: Release notes
        if: env.TAG != ''
        shell: pwsh
        run: |
          # раздел этой версии из CHANGELOG.md: от «## [2.0.0]» до следующего «## »
          $notes = ''
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md -Encoding utf8
            $ver = [regex]::Escape($env:VERSION)
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match "^## \[?v?$ver\]?(\s|$)") { $start = $i; break } }
            if ($start -ge 0) {
              $body = @()
              for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $body += $lines[$i] }
              $notes = ($body -join "`n").Trim()
            }
          }
          $repo = "${{ github.repository }}"
          $text = @"
          ## Скачать

          **[WinTweaker.exe](https://github.com/$repo/releases/download/$env:TAG/WinTweaker.exe)** ($env:SIZE_MB МБ) — один файл, устанавливать ничего не нужно. Нужны Windows 10 x64 и права администратора.

          ### Windows предупреждает при первом запуске
          У программы нет платного сертификата подписи, поэтому Windows спрашивает подтверждение:
          - синее окно SmartScreen → **Подробнее** → **Выполнить в любом случае**;
          - или заранее: правый клик по файлу → **Свойства** → **Разблокировать** → ОК.

          ### Проверка файла
          SHA-256: ``$env:SHA256``
          ``````
          certutil -hashfile WinTweaker.exe SHA256
          ``````
          Файл собран автоматически в [GitHub Actions](https://github.com/$repo/actions/runs/${{ github.run_id }}) из кода этого релиза.
          "@
          if ($env:SIGN_THUMB) {
            $text += "`n" + @"

          ### Цифровая подпись
          Exe подписан автором: **$env:SIGN_SUBJECT**, отпечаток сертификата ``$env:SIGN_THUMB``.
          Проверить: правый клик по файлу → **Свойства** → **Цифровые подписи** → **Сведения** → **Просмотр сертификата** → **Состав** → **Отпечаток**.
          Подпись самоподписанная: она подтверждает, что файл выпущен автором и не изменён после сборки, но Windows всё равно покажет «Неизвестный издатель».
          "@
          }
          if ($notes) { $text = "## Что нового`n`n$notes`n`n$text" }
          Set-Content release-notes.md $text -Encoding utf8
          Get-Content release-notes.md

      - name: Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            publish/WinTweaker.exe
            publish/WinTweaker.exe.sha256
            publish/WinTweaker-signing.cer
          body_path: release-notes.md
          # релиз, созданный на сайте: его описание сохраняется, наше добавляется ниже
          append_body: true
          make_latest: true
