name: Build

# Сборка при каждом пуше и PR — проверка, что проект компилируется (артефакт можно скачать в Actions).
# Релиз: git tag v1.2.3 && git push origin v1.2.3 — соберёт WinTweaker.exe и опубликует релиз.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: pwsh
        run: |
          $v = '0.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Publish
        run: dotnet publish WinTweaker.csproj -c Release -p:Version=${{ env.VERSION }} -o publish

      - name: Verify admin manifest
        shell: pwsh
        run: |
          # в exe должен быть манифест requireAdministrator — иначе программа запустится без прав
          $bytes = [IO.File]::ReadAllBytes("publish/WinTweaker.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes) + [Text.Encoding]::Unicode.GetString($bytes)
          if ($text -notmatch 'requireAdministrator') { throw 'В WinTweaker.exe нет манифеста requireAdministrator' }
          'Манифест requireAdministrator на месте'

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash publish/WinTweaker.exe -Algorithm SHA256).Hash + '  WinTweaker.exe' | Out-File publish/WinTweaker.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: WinTweaker-${{ env.VERSION }}
          path: |
            publish/WinTweaker.exe
            publish/WinTweaker.exe.sha256

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/WinTweaker.exe
            publish/WinTweaker.exe.sha256
          generate_release_notes: true
          body: |
            ### Скачать
            **WinTweaker.exe** ниже — один файл, ничего ставить не нужно. Запускается от администратора.

            ### «Неизвестный издатель» / «Windows защитил ваш компьютер»
            У программы нет платной цифровой подписи, поэтому Windows предупреждает при первом запуске. Это нормально для бесплатных программ с GitHub.
            - Окно «Не удаётся проверить издателя» → снимите галочку «Всегда спрашивать» и нажмите **Запустить**.
            - Синее окно SmartScreen → **Подробнее** → **Выполнить в любом случае**.
            - Или заранее: правый клик по файлу → **Свойства** → внизу галочка **Разблокировать** → ОК.

            Проверить, что файл не подменён: сравните SHA-256 из `WinTweaker.exe.sha256` с выводом `certutil -hashfile WinTweaker.exe SHA256`.

